<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="app_title">OCR文字识别助手</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <!-- 无障碍状态播报区 -->
  <div id="a11y-live" aria-live="polite" aria-atomic="true" class="sr-only"></div>

  <div class="container">
    <!-- 头部 -->
    <header class="header">
      <img src="icons/icon32.png" alt="Logo" class="logo">
      <h1 data-i18n="app_title">OCR文字识别助手</h1>
      <div class="header-actions">
        <button id="themeBtn" class="icon-btn" data-i18n-title="btn_theme_toggle" data-i18n-aria="btn_theme_toggle" title="切换主题" aria-label="切换深色/浅色主题">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="theme-icon-light">
            <circle cx="12" cy="12" r="5"></circle>
            <line x1="12" y1="1" x2="12" y2="3"></line>
            <line x1="12" y1="21" x2="12" y2="23"></line>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
            <line x1="1" y1="12" x2="3" y2="12"></line>
            <line x1="21" y1="12" x2="23" y2="12"></line>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
          </svg>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="theme-icon-dark" style="display:none;">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
          </svg>
        </button>
        <button id="settingsBtn" class="icon-btn" data-i18n-title="btn_settings" data-i18n-aria="btn_settings" title="设置" aria-label="打开设置">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
          </svg>
        </button>
      </div>
    </header>

    <!-- 主按钮区域 -->
    <main class="main-action">
      <button id="captureBtn" class="capture-btn">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
          <circle cx="8.5" cy="8.5" r="1.5"></circle>
          <polyline points="21 15 16 10 5 21"></polyline>
        </svg>
        <span data-i18n="btn_capture">开始截图识别</span>
      </button>
      <p class="hint" data-i18n="hint_capture">点击后在页面上框选需要识别的文字区域</p>
      <div class="secondary-actions">
        <button id="repeatCaptureBtn" class="btn" type="button" disabled data-i18n="popup_repeat_capture">再次识别此区域</button>
        <button id="imageImportBtn" class="btn" type="button" data-i18n="popup_import_image">导入图片</button>
      </div>
      <p id="repeatCaptureHint" class="hint" role="status" data-i18n="popup_repeat_no_region">先在当前页面完成一次框选识别。</p>
    </main>

    <!-- API配置提示 -->
    <button id="configTip" type="button" class="config-tip hidden">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"></circle>
        <line x1="12" y1="8" x2="12" y2="12"></line>
        <line x1="12" y1="16" x2="12.01" y2="16"></line>
      </svg>
      <span data-i18n="tip_config_api">请先配置API密钥</span>
    </button>

    <!-- 历史记录区域 -->
    <section id="historyArea" class="history-area">
      <div class="history-header">
        <h3 data-i18n="history_title">最近识别记录</h3>
        <div class="history-header-actions">
          <button id="exportHistoryBtn" class="icon-btn hidden" data-i18n-title="history_export" data-i18n-aria="history_export" title="导出历史" aria-label="导出历史记录">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
              <polyline points="7 10 12 15 17 10"></polyline>
              <line x1="12" y1="15" x2="12" y2="3"></line>
            </svg>
          </button>
          <button id="clearHistoryBtn" class="icon-btn hidden" data-i18n-title="btn_clear_history" data-i18n-aria="btn_clear_history" title="清空历史" aria-label="清空历史记录">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="3 6 5 6 21 6"></polyline>
              <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
            </svg>
          </button>
        </div>
      </div>
      <p class="history-retention-hint" data-i18n="history_retention_hint">自动保留最近 50 条普通记录；收藏和未完成草稿不受此上限影响。</p>
      <div class="history-management-actions">
        <button id="restoreHistoryBtn" class="btn" type="button" data-i18n="history_restore">恢复历史备份</button>
        <button id="cleanupHistoryBtn" class="btn hidden" type="button" data-i18n="history_cleanup">清理普通历史</button>
        <input id="historyBackupFile" type="file" accept=".json,application/json" hidden>
      </div>
      <div id="historyFilterWrap" class="history-filter-wrap hidden">
        <label for="historyFilter" data-i18n="history_filter_label">显示记录</label>
        <select id="historyFilter" class="language-select">
          <option value="all" data-i18n="history_filter_all">全部</option>
          <option value="favorites" data-i18n="history_filter_favorites">收藏</option>
          <option value="drafts" data-i18n="history_filter_drafts">未完成草稿</option>
        </select>
      </div>
      <div id="historySearchWrap" class="history-search-wrap hidden">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input id="historySearch" type="search" data-i18n-placeholder="history_search_placeholder" data-i18n-aria="history_search_placeholder" placeholder="搜索历史记录" aria-label="搜索历史记录">
      </div>
      <!-- 空状态提示 -->
      <div id="historyEmptyState" class="history-empty-state">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2">
          <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
          <circle cx="8.5" cy="8.5" r="1.5"></circle>
          <polyline points="21 15 16 10 5 21"></polyline>
        </svg>
        <p data-i18n="history_empty_title">暂无识别记录</p>
        <p class="history-empty-hint" data-i18n="history_empty_hint">点击上方按钮开始截图识别</p>
      </div>
      <div id="historySearchEmptyState" class="history-empty-state compact hidden">
        <p data-i18n="history_search_empty">没有匹配的历史记录</p>
      </div>
      <!-- 历史列表 -->
      <div id="historyList" class="history-list hidden"></div>
      <!-- 历史详情预览 -->
      <div id="historyPreview" class="history-preview hidden">
        <div class="history-preview-header">
          <h4 data-i18n="preview_title">识别结果</h4>
          <button id="closePreviewBtn" class="icon-btn" data-i18n-title="btn_close_preview" data-i18n-aria="btn_close_preview" title="关闭" aria-label="关闭预览">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <line x1="18" y1="6" x2="6" y2="18"></line>
              <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
          </button>
        </div>
        <div class="history-protection-controls">
          <button id="previewFavoriteBtn" class="btn" type="button" aria-pressed="false" data-i18n="history_favorite">收藏</button>
          <label for="historyName" data-i18n="history_name_label">记录名称</label>
          <input id="historyName" type="text" maxlength="120" data-i18n-placeholder="history_name_placeholder" placeholder="添加名称（可选）" autocomplete="off">
          <div class="history-name-actions">
            <button id="historyNameCancelBtn" class="btn" type="button" disabled data-i18n="history_name_cancel">取消命名</button>
            <button id="historyNameSaveBtn" class="btn" type="button" disabled data-i18n="history_name_save">保存名称</button>
          </div>
          <p id="historyMetadataStatus" class="history-preview-status" role="status" aria-live="polite"></p>
        </div>
        <div id="historyPreviewMeta" class="history-preview-meta"></div>
        <div id="historyDraft"></div>
        <textarea id="historyPreviewText" data-i18n-aria="history_preview_aria" aria-label="历史记录详情" aria-describedby="historyEditHint"></textarea>
        <p id="historyEditHint" class="history-edit-hint" data-i18n="history_edit_hint">可修订文字；点击保存后更新历史记录。</p>
        <p id="historyPreviewStatus" class="history-preview-status" role="status" aria-live="polite"></p>
        <div id="historyConflict"></div>
        <div class="history-preview-actions">
          <button id="previewRevertBtn" class="btn" type="button" disabled data-i18n="history_revert_changes">还原修改</button>
          <button id="previewSaveBtn" class="btn btn-primary" type="button" disabled data-i18n="content_btn_save_changes">保存修改</button>
          <button id="previewCopyBtn" class="btn btn-primary" data-i18n="btn_copy_all">复制全文</button>
        </div>
        <div id="historyTranslation"></div>
      </div>
    </section>

    <!-- 底部信息 -->
    <footer class="footer">
      <span data-i18n="footer_supported_apis">支持 7 种 API：Claude / OpenAI / 智谱AI / 百度OCR / 阿里云 / 通用兼容 / 自定义</span>
      <div class="language-switch">
        <select id="languageSelect" class="language-select" data-i18n-aria="label_ui_language" aria-label="界面语言">
          <option value="auto" data-i18n="language_auto">自动</option>
          <option value="zh_CN" data-i18n="language_zh">中文</option>
          <option value="en" data-i18n="language_en">English</option>
        </select>
      </div>
    </footer>
  </div>

  <dialog id="historyManagementDialog" class="history-management-dialog" aria-labelledby="historyManagementTitle" aria-describedby="historyManagementDescription">
    <h3 id="historyManagementTitle"></h3>
    <p id="historyManagementDescription"></p>
    <p id="historyManagementFile" class="history-management-file"></p>
    <dl id="historyManagementCounts" class="history-management-counts hidden"></dl>
    <p id="historyManagementStatus" role="status" aria-live="polite"></p>
    <div class="history-management-dialog-actions">
      <button id="historyManagementCancel" class="btn" type="button" data-i18n="history_management_cancel">取消</button>
      <button id="historyManagementRefresh" class="btn hidden" type="button" data-i18n="history_management_refresh">刷新预览</button>
      <button id="historyManagementConfirm" class="btn btn-primary" type="button" disabled></button>
    </div>
  </dialog>

  <script src="i18n-runtime.js"></script>
  <script src="provider-config.js"></script>
  <script src="extension-runtime.js"></script>
  <script src="translation-ui.js"></script>
  <script src="draft-ui.js"></script>
  <script src="conflict-ui.js"></script>
  <script src="history-management-ui.js"></script>
  <script src="popup.js"></script>
</body>
</html>
